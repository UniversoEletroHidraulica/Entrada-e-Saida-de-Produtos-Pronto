<!-- Script de Lógica e Supabase -->
    <script>
        const SUPABASE_URL = 'https://wwuivpaeldpigajmqclg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind3dWl2cGFlbGRwaWdham1xY2xnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3OTc3MTgsImV4cCI6MjEwODM3MzcxOH0.BBCGPPfXhknNulycPZyOu--A2XKzgo-Tpx3qGfKp0DE';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let produtos = [];
        let saidas = [];
        let listaPedido = [];
        let vendedores = ['Douglas', 'Gleydson', 'Nicolas', 'Alexandre'];
        let filtroPeriodoAtual = 'diario';

        // Inicialização garantida após carregamento do DOM
        window.addEventListener('DOMContentLoaded', () => {
            carregarVendedoresLocais();
            popularSelectVendedores();
            
            const campoDataHora = document.getElementById('saida-datahora');
            if (campoDataHora) campoDataHora.value = new Date().toISOString().slice(0, 16);
            
            const campoDataPdf = document.getElementById('pdf-data-geracao');
            if (campoDataPdf) campoDataPdf.innerText = 'Data: ' + new Date().toLocaleDateString('pt-BR');

            // 1. Carrega primeiro o cache local (Instantâneo)
            carregarCacheLocal();
            
            // 2. Busca do Supabase em segundo plano
            carregarDadosSupabase();
            
            setInterval(verificarConexao, 30000);
        });

        // Carrega dados salvos no navegador para exibição imediata
        function carregarCacheLocal() {
            const prodCache = localStorage.getItem('universo_produtos_cache');
            const saidasCache = localStorage.getItem('universo_saidas_cache');
            
            if (prodCache) produtos = JSON.parse(prodCache);
            if (saidasCache) saidas = JSON.parse(saidasCache);
            
            atualizarTodasTelas();
        }

        function salvarCacheLocal() {
            localStorage.setItem('universo_produtos_cache', JSON.stringify(produtos));
            localStorage.setItem('universo_saidas_cache', JSON.stringify(saidas));
        }

        async function verificarConexao() {
            try {
                const { error } = await _supabase.from('produtos').select('id').limit(1);
                const badge = document.getElementById('sync-status');
                if (error) throw error;
                badge.className = "flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-medium";
                badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span><span>Conectado ao Supabase</span>';
            } catch (err) {
                const badge = document.getElementById('sync-status');
                if (badge) {
                    badge.className = "flex items-center gap-2 px-3 py-1.5 rounded-full bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs font-medium";
                    badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-rose-500"></span><span>Erro de Sincronização</span>';
                }
            }
        }

        async function carregarDadosSupabase() {
            try {
                const { data: dadosProdutos, error: errProd } = await _supabase.from('produtos').select('*');
                if (errProd) throw errProd;
                if (dadosProdutos) produtos = dadosProdutos;

                const { data: dadosSaidas, error: errSaida } = await _supabase.from('saidas').select('*');
                if (errSaida) throw errSaida;
                if (dadosSaidas) saidas = dadosSaidas;

                // Salva o resultado mais recente no cache e atualiza a tela
                salvarCacheLocal();
                atualizarTodasTelas();
            } catch (err) {
                console.error("Erro ao carregar dados do Supabase:", err);
            }
        }

        function atualizarTodasTelas() {
            renderizarTabelaEntrada();
            renderizarEstoqueDisponivel();
            atualizarSelectProdutosSaida();
            atualizarSelectProdutosPedido();
            renderizarSugestoesCompras();
            renderizarTabelaPedido();
            renderizarHistoricoSaidas();
        }

        function mudarAba(abaId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('bg-blue-600', 'text-white', 'shadow-md', 'shadow-blue-600/20');
                el.classList.add('text-slate-400', 'hover:bg-slate-800', 'hover:text-white');
            });

            document.getElementById(`aba-${abaId}`).classList.remove('hidden');
            const btnAtivo = document.getElementById(`btn-aba-${abaId}`);
            if (btnAtivo) {
                btnAtivo.classList.remove('text-slate-400', 'hover:bg-slate-800', 'hover:text-white');
                btnAtivo.classList.add('bg-blue-600', 'text-white', 'shadow-md', 'shadow-blue-600/20');
            }
        }

        function carregarVendedoresLocais() {
            const salvos = localStorage.getItem('universo_vendedores');
            if (salvos) {
                vendedores = JSON.parse(salvos);
            }
        }

        function popularSelectVendedores() {
            const selects = [document.getElementById('saida-vendedor'), document.getElementById('edit-saida-vendedor')];
            selects.forEach(select => {
                if(!select) return;
                select.innerHTML = '';
                vendedores.forEach(v => {
                    const opt = document.createElement('option');
                    opt.value = v;
                    opt.textContent = v;
                    select.appendChild(opt);
                });
                const optOutro = document.createElement('option');
                optOutro.value = 'OUTRO';
                optOutro.textContent = '+ Adicionar novo vendedor...';
                select.appendChild(optOutro);
            });

            selects.forEach(select => {
                if(!select) return;
                select.onchange = function() {
                    if (this.value === 'OUTRO') {
                        const novoNome = prompt("Digite o nome do novo vendedor:");
                        if (novoNome && novoNome.trim() !== '') {
                            const nomeLimpo = novoNome.trim();
                            if (!vendedores.includes(nomeLimpo)) {
                                vendedores.push(nomeLimpo);
                                localStorage.setItem('universo_vendedores', JSON.stringify(vendedores));
                                popularSelectVendedores();
                                this.value = nomeLimpo;
                            } else {
                                this.value = nomeLimpo;
                            }
                        } else {
                            this.value = vendedores[0];
                        }
                    }
                };
            });
        }

        function converterFoto(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64 = e.target.result;
                    document.getElementById('prod-foto-base64').value = base64;
                    const img = document.getElementById('preview-img');
                    const icon = document.getElementById('preview-icon');
                    img.src = base64;
                    img.classList.remove('hidden');
                    icon.classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        async function salvarProduto(event) {
            event.preventDefault();
            const idEdicao = document.getElementById('edit-produto-id').value;
            const nome = document.getElementById('prod-nome').value.trim();
            const marca = document.getElementById('prod-marca').value.trim();
            const quantidade = parseInt(document.getElementById('prod-qtd').value);
            const preco = parseFloat(document.getElementById('prod-preco').value);
            const foto = document.getElementById('prod-foto-base64').value || 'https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=300';

            try {
                if (idEdicao) {
                    const { error } = await _supabase.from('produtos').update({ nome, marca, quantidade, preco, foto }).eq('id', idEdicao);
                    if (error) throw error;
                } else {
                    const payload = { nome, marca, quantidade, preco, foto };
                    const { error } = await _supabase.from('produtos').insert([payload]);
                    if (error) throw error;
                }

                cancelarEdicaoProduto();
                await carregarDadosSupabase();
                alert('Produto salvo com sucesso!');
            } catch (err) {
                console.error("Erro ao salvar produto:", err);
                alert("Erro ao salvar produto no Supabase: " + err.message);
            }
        }

        function renderizarTabelaEntrada() {
            const corpo = document.getElementById('tabela-entrada-corpo');
            if (!corpo) return;
            corpo.innerHTML = '';

            if (produtos.length === 0) {
                corpo.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-slate-500 text-xs">Nenhum produto cadastrado.</td></tr>`;
                return;
            }

            produtos.slice(0, 10).forEach(p => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-800/40 transition-colors";
                tr.innerHTML = `
                    <td class="py-2.5 px-3">
                        <img src="${p.foto || 'https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=300'}" class="w-10 h-10 rounded-lg object-cover border border-slate-700">
                    </td>
                    <td class="py-2.5 px-3">
                        <div class="font-bold text-white text-sm">${p.nome}</div>
                        <div class="text-xs text-slate-400">${p.marca}</div>
                    </td>
                    <td class="py-2.5 px-3 text-center font-bold text-white">${p.quantidade}</td>
                    <td class="py-2.5 px-3 text-slate-300">R$ ${Number(p.preco).toFixed(2)}</td>
                    <td class="py-2.5 px-3 text-right">
                        <button onclick="prepararEdicaoProduto('${p.id}')" class="bg-blue-600/20 text-blue-400 hover:bg-blue-600/30 p-1.5 rounded-lg text-xs mr-1" title="Editar"><i class="fa-solid fa-pen"></i></button>
                    </td>
                `;
                corpo.appendChild(tr);
            });
        }

        function prepararEdicaoProduto(id) {
            const p = produtos.find(item => item.id == id);
            if (!p) return;

            document.getElementById('edit-produto-id').value = p.id;
            document.getElementById('prod-nome').value = p.nome;
            document.getElementById('prod-marca').value = p.marca;
            document.getElementById('prod-qtd').value = p.quantidade;
            document.getElementById('prod-preco').value = p.preco;
            document.getElementById('prod-foto-base64').value = p.foto || '';

            if (p.foto) {
                const img = document.getElementById('preview-img');
                const icon = document.getElementById('preview-icon');
                img.src = p.foto;
                img.classList.remove('hidden');
                icon.classList.add('hidden');
            }

            document.getElementById('form-titulo-modo').innerText = 'Editando Produto: ' + p.nome;
            document.getElementById('btn-cancelar-edicao').classList.remove('hidden');
            document.getElementById('btn-salvar-produto').innerHTML = '<i class="fa-solid fa-save"></i> Atualizar Produto';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelarEdicaoProduto() {
            document.getElementById('form-produto').reset();
            document.getElementById('edit-produto-id').value = '';
            document.getElementById('preview-img').classList.add('hidden');
            document.getElementById('preview-icon').classList.remove('hidden');
            document.getElementById('form-titulo-modo').innerText = 'Cadastrar Novo Produto';
            document.getElementById('btn-cancelar-edicao').classList.add('hidden');
            document.getElementById('btn-salvar-produto').innerHTML = '<i class="fa-solid fa-check"></i> Salvar Produto no Estoque';
        }

        async function alterarQtdRapida(id, delta) {
            const p = produtos.find(item => item.id == id);
            if (!p) return;
            const novaQtd = Math.max(0, p.quantidade + delta);

            try {
                const { error } = await _supabase.from('produtos').update({ quantidade: novaQtd }).eq('id', id);
                if (error) throw error;
                await carregarDadosSupabase();
            } catch (err) {
                console.error("Erro ao alterar quantidade:", err);
                alert("Erro ao atualizar quantidade no servidor.");
            }
        }

        function renderizarEstoqueDisponivel() {
            const grid = document.getElementById('grid-estoque');
            if (!grid) return;
            grid.innerHTML = '';
            const filtro = (document.getElementById('filtro-estoque')?.value || '').toLowerCase();

            const disponiveis = produtos.filter(p => p.quantidade > 0 && (p.nome.toLowerCase().includes(filtro) || p.marca.toLowerCase().includes(filtro)));

            if (disponiveis.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-10 text-slate-500 text-sm">Nenhum produto com estoque disponível encontrado.</div>`;
                return;
            }

            disponiveis.forEach(p => {
                const proximoDeAcabar = p.quantidade <= 3;
                const card = document.createElement('div');
                card.className = "bg-slate-800/60 border border-slate-700/80 rounded-2xl p-4 flex flex-col justify-between shadow-lg relative overflow-hidden";
                
                card.innerHTML = `
                    ${proximoDeAcabar ? '<span class="absolute top-3 right-3 bg-amber-500/20 border border-amber-500/30 text-amber-300 text-[10px] font-bold px-2 py-0.5 rounded-full flex items-center gap-1 animate-pulse"><i class="fa-solid fa-triangle-exclamation"></i> Próximo de acabar</span>' : ''}
                    <div>
                        <div class="w-full h-36 rounded-xl overflow-hidden bg-slate-900 mb-3 border border-slate-700">
                            <img src="${p.foto || 'https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=300'}" class="w-full h-full object-cover">
                        </div>
                        <h3 class="font-bold text-white text-sm mb-0.5">${p.nome}</h3>
                        <p class="text-xs text-slate-400 mb-2">${p.marca}</p>
                        <div class="text-xs font-semibold text-emerald-400 mb-3">R$ ${Number(p.preco).toFixed(2)}</div>
                    </div>
                    <div>
                        <div class="flex items-center justify-between bg-slate-900 border border-slate-700 rounded-xl p-1.5 mb-2">
                            <span class="text-xs text-slate-400 pl-2">Estoque:</span>
                            <div class="flex items-center gap-2">
                                <button onclick="alterarQtdRapida('${p.id}', -1)" class="w-7 h-7 rounded-lg bg-rose-600/20 hover:bg-rose-600/30 text-rose-400 flex items-center justify-center text-xs font-bold transition-all"><i class="fa-solid fa-minus"></i></button>
                                <span class="font-bold text-white text-sm w-6 text-center">${p.quantidade}</span>
                                <button onclick="alterarQtdRapida('${p.id}', 1)" class="w-7 h-7 rounded-lg bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 flex items-center justify-center text-xs font-bold transition-all"><i class="fa-solid fa-plus"></i></button>
                            </div>
                        </div>
                        <button onclick="prepararEdicaoProduto('${p.id}'); mudarAba('entrada');" class="w-full bg-slate-700/50 hover:bg-slate-700 text-slate-300 text-xs font-semibold py-2 rounded-xl transition-all">Editar Produto</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderizarSugestoesCompras() {
            const container = document.getElementById('lista-sugestoes');
            if (!container) return;
            container.innerHTML = '';

            const sugeridos = produtos.filter(p => p.quantidade <= 3);

            if (sugeridos.length === 0) {
                container.innerHTML = `<div class="col-span-full text-slate-500 text-xs py-2">Nenhum produto precisando de reposição no momento.</div>`;
                return;
            }

            sugeridos.forEach(p => {
                const card = document.createElement('div');
                card.className = "bg-slate-900/60 border border-slate-800 rounded-xl p-3 flex items-center justify-between gap-3";
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <img src="${p.foto || 'https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=300'}" class="w-10 h-10 rounded-lg object-cover border border-slate-700 shrink-0">
                        <div>
                            <h4 class="font-bold text-white text-xs">${p.nome}</h4>
                            <p class="text-[10px] text-slate-400">${p.marca} • <span class="${p.quantidade === 0 ? 'text-rose-400 font-bold' : 'text-amber-400'}">Estoque: ${p.quantidade}</span></p>
                        </div>
                    </div>
                    <button onclick="adicionarNaListaPedido('${p.id}')" class="bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600/30 px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap"><i class="fa-solid fa-plus"></i> Pedir</button>
                `;
                container.appendChild(card);
            });
        }

        function atualizarSelectProdutosPedido() {
            const select = document.getElementById('select-adicionar-pedido');
            if (!select) return;
            select.innerHTML = '<option value="">Selecione um produto cadastrado...</option>';
            produtos.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.textContent = `${p.nome} (${p.marca}) - Estoque: ${p.quantidade}`;
                select.appendChild(opt);
            });
        }

        function adicionarItemPedidoSelecionado() {
            const id = document.getElementById('select-adicionar-pedido').value;
            if (!id) return;
            adicionarNaListaPedido(id);
            document.getElementById('select-adicionar-pedido').value = '';
        }

        function adicionarNaListaPedido(id) {
            const p = produtos.find(item => item.id == id);
            if (!p) return;

            const existente = listaPedido.find(item => item.id == id);
            if (existente) {
                existente.qtdPedir += 5;
            } else {
                listaPedido.push({
                    id: p.id,
                    nome: p.nome,
                    marca: p.marca,
                    quantidadeAtual: p.quantidade,
                    qtdPedir: 10
                });
            }
            renderizarTabelaPedido();
        }

        function renderizarTabelaPedido() {
            const corpo = document.getElementById('tabela-pedido-corpo');
            if (!corpo) return;
            corpo.innerHTML = '';

            if (listaPedido.length === 0) {
                corpo.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-slate-500 text-xs">Nenhum item na lista de pedidos. Adicione acima ou pelas sugestões.</td></tr>`;
                return;
            }

            listaPedido.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.className = "border-b border-slate-800";
                tr.innerHTML = `
                    <td class="py-2 px-2">
                        <div class="font-bold text-white text-xs">${item.nome}</div>
                        <div class="text-[10px] text-slate-400">${item.marca}</div>
                    </td>
                    <td class="py-2 px-2 text-center text-slate-300">${item.quantidadeAtual}</td>
                    <td class="py-2 px-2 text-center">
                        <input type="number" min="1" value="${item.qtdPedir}" onchange="atualizarQtdPedido(${index}, this.value)" class="w-20 bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-center text-xs text-white font-bold">
                    </td>
                    <td class="py-2 px-2 text-right">
                        <button onclick="removerItemPedido(${index})" class="text-rose-400 hover:text-rose-300 p-1 text-xs"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                corpo.appendChild(tr);
            });
        }

        function atualizarQtdPedido(index, valor) {
            const val = parseInt(valor);
            if (val > 0) {
                listaPedido[index].qtdPedir = val;
            }
        }

        function removerItemPedido(index) {
            listaPedido.splice(index, 1);
            renderizarTabelaPedido();
        }

        function gerarPdfListaCompras() {
            if (listaPedido.length === 0) {
                alert("Adicione produtos à lista antes de gerar o PDF.");
                return;
            }
            const elemento = document.getElementById('pdf-container-conteudo');
            const opt = {
                margin: 10,
                filename: 'lista-de-compras-universo-eletro.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, backgroundColor: '#0f172a' },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().from(elemento).set(opt).save();
        }

        function atualizarSelectProdutosSaida() {
            const select = document.getElementById('saida-produto');
            if (!select) return;
            select.innerHTML = '<option value="">Selecione do estoque...</option>';
            produtos.filter(p => p.quantidade > 0).forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.textContent = `${p.nome} (${p.marca}) - Disp: ${p.quantidade} - R$ ${Number(p.preco).toFixed(2)}`;
                select.appendChild(opt);
            });
        }

        function atualizarPrecoSaida() {
            const id = document.getElementById('saida-produto').value;
            const p = produtos.find(item => item.id == id);
            if (p) {
                document.getElementById('saida-valor-unit').value = p.preco;
                calcularTotalSaida();
            }
        }

        function calcularTotalSaida() {
            const qtd = parseInt(document.getElementById('saida-qtd').value) || 0;
            const unit = parseFloat(document.getElementById('saida-valor-unit').value) || 0;
            document.getElementById('saida-valor-total').value = (qtd * unit).toFixed(2);
        }

        async function salvarSaida(event) {
            event.preventDefault();
            const produtoId = document.getElementById('saida-produto').value;
            const tipo = document.getElementById('saida-tipo').value;
            const quantidade = parseInt(document.getElementById('saida-qtd').value);
            const vendedor = document.getElementById('saida-vendedor').value;
            const dataHoraRaw = document.getElementById('saida-datahora').value;
            const valorUnitario = parseFloat(document.getElementById('saida-valor-unit').value);
            const valorTotal = parseFloat(document.getElementById('saida-valor-total').value);

            const p = produtos.find(item => item.id == produtoId);
            if (!p) {
                alert("Selecione um produto válido.");
                return;
            }

            if (quantidade > p.quantidade) {
                alert(`Quantidade solicitada (${quantidade}) é maior do que o estoque disponível (${p.quantidade}).`);
                return;
            }

            try {
                const novaQtd = p.quantidade - quantidade;
                const { error: errProd } = await _supabase.from('produtos').update({ quantidade: novaQtd }).eq('id', produtoId);
                if (errProd) throw errProd;

                const payloadSaida = {
                    produto_id: produtoId,
                    produto_nome: `${p.nome} (${p.marca})`,
                    quantidade: quantidade,
                    tipo: tipo,
                    vendedor: vendedor,
                    valor_unitario: valorUnitario,
                    valor_total: valorTotal,
                    data_hora: dataHoraRaw ? new Date(dataHoraRaw).toISOString() : new Date().toISOString()
                };

                const { error: errSaida } = await _supabase.from('saidas').insert([payloadSaida]);
                if (errSaida) throw errSaida;

                document.getElementById('form-saida').reset();
                document.getElementById('saida-datahora').value = new Date().toISOString().slice(0, 16);
                
                await carregarDadosSupabase();
                alert('Saída registrada e estoque atualizado com sucesso!');
                mudarAba('historico');
            } catch (err) {
                console.error("Erro ao registrar saída:", err);
                alert("Erro ao registrar saída no Supabase: " + err.message);
            }
        }

        function mudarFiltroPeriodo(periodo) {
            filtroPeriodoAtual = periodo;
            ['diario', 'semanal', 'mensal', 'todos'].forEach(p => {
                const btn = document.getElementById(`btn-filtro-${p}`);
                if (btn) {
                    if (p === periodo) {
                        btn.className = "flex-1 sm:flex-none px-3 py-1.5 rounded-lg text-xs font-semibold bg-purple-600 text-white transition-all";
                    } else {
                        btn.className = "flex-1 sm:flex-none px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition-all";
                    }
                }
            });
            renderizarHistoricoSaidas();
        }

        function renderizarHistoricoSaidas() {
            const corpo = document.getElementById('tabela-historico-corpo');
            if (!corpo) return;
            corpo.innerHTML = '';

            const agora = new Date();
            const filtradas = saidas.filter(s => {
                const dataSaida = new Date(s.data_hora);
                if (filtroPeriodoAtual === 'diario') {
                    return dataSaida.toDateString() === agora.toDateString();
                } else if (filtroPeriodoAtual === 'semanal') {
                    const diffTime = Math.abs(agora - dataSaida);
                    const diffDays = diffTime / (1000 * 60 * 60 * 24);
                    return diffDays <= 7;
                } else if (filtroPeriodoAtual === 'mensal') {
                    return dataSaida.getMonth() === agora.getMonth() && dataSaida.getFullYear() === agora.getFullYear();
                }
                return true;
            });

            let totalQtd = 0;
            let totalValor = 0;

            if (filtradas.length === 0) {
                corpo.innerHTML = `<tr><td colspan="7" class="text-center py-6 text-slate-500 text-xs">Nenhum registro de saída neste período.</td></tr>`;
                document.getElementById('resumo-qtd-saidas').innerText = '0 itens';
                document.getElementById('resumo-valor-saidas').innerText = 'R$ 0,00';
                return;
            }

            filtradas.forEach(s => {
                totalQtd += s.quantidade;
                totalValor += Number(s.valor_total || 0);

                const dataFormatada = new Date(s.data_hora).toLocaleString('pt-BR', {
                    day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
                });

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-800/40 transition-colors";
                tr.innerHTML = `
                    <td class="py-2.5 px-3 text-xs text-slate-300">${dataFormatada}</td>
                    <td class="py-2.5 px-3 font-bold text-white text-sm">${s.produto_nome || 'Produto'}</td>
                    <td class="py-2.5 px-3">
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${s.tipo === 'venda' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-blue-500/20 text-blue-400 border border-blue-500/30'}">
                            ${s.tipo === 'venda' ? 'Venda' : 'Transferência'}
                        </span>
                    </td>
                    <td class="py-2.5 px-3 text-center font-bold text-white">${s.quantidade}</td>
                    <td class="py-2.5 px-3 text-slate-300">${s.vendedor}</td>
                    <td class="py-2.5 px-3 font-bold text-emerald-400">R$ ${Number(s.valor_total).toFixed(2)}</td>
                    <td class="py-2.5 px-3 text-right">
                        <button onclick="abrirModalEditarSaida('${s.id}')" class="bg-purple-600/20 text-purple-400 hover:bg-purple-600/30 p-1.5 rounded-lg text-xs mr-1" title="Corrigir / Editar"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="excluirSaida('${s.id}')" class="bg-rose-600/20 text-rose-400 hover:bg-rose-600/30 p-1.5 rounded-lg text-xs" title="Excluir Venda"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                corpo.appendChild(tr);
            });

            document.getElementById('resumo-qtd-saidas').innerText = `${totalQtd} itens`;
            document.getElementById('resumo-valor-saidas').innerText = `R$ ${totalValor.toFixed(2)}`;
        }

        function abrirModalEditarSaida(id) {
            const s = saidas.find(item => item.id == id);
            if (!s) return;

            document.getElementById('edit-saida-id').value = s.id;
            document.getElementById('edit-saida-prod-id').value = s.produto_id;
            document.getElementById('edit-saida-qtd-antiga').value = s.quantidade;
            document.getElementById('edit-saida-prod-nome').value = s.produto_nome;
            document.getElementById('edit-saida-tipo').value = s.tipo;
            document.getElementById('edit-saida-qtd').value = s.quantidade;
            
            const selV = document.getElementById('edit-saida-vendedor');
            selV.innerHTML = '';
            vendedores.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v;
                opt.textContent = v;
                selV.appendChild(opt);
            });
            document.getElementById('edit-saida-vendedor').value = s.vendedor;

            const dataLocal = new Date(s.data_hora).toISOString().slice(0, 16);
            document.getElementById('edit-saida-datahora').value = dataLocal;
            document.getElementById('edit-saida-val-unit').value = s.valor_unitario;
            document.getElementById('edit-saida-val-total').value = s.valor_total;

            document.getElementById('modal-editar-saida').classList.remove('hidden');
        }

        function fecharModalSaida() {
            document.getElementById('modal-editar-saida').classList.add('hidden');
        }

        function calcularTotalEdicaoSaida() {
            const qtd = parseInt(document.getElementById('edit-saida-qtd').value) || 0;
            const unit = parseFloat(document.getElementById('edit-saida-val-unit').value) || 0;
            document.getElementById('edit-saida-val-total').value = (qtd * unit).toFixed(2);
        }

        async function atualizarSaida(event) {
            event.preventDefault();
            const id = document.getElementById('edit-saida-id').value;
            const produtoId = document.getElementById('edit-saida-prod-id').value;
            const qtdAntiga = parseInt(document.getElementById('edit-saida-qtd-antiga').value);
            
            const tipo = document.getElementById('edit-saida-tipo').value;
            const novaQtd = parseInt(document.getElementById('edit-saida-qtd').value);
            const vendedor = document.getElementById('edit-saida-vendedor').value;
            const dataHoraRaw = document.getElementById('edit-saida-datahora').value;
            const valorUnitario = parseFloat(document.getElementById('edit-saida-val-unit').value);
            const valorTotal = parseFloat(document.getElementById('edit-saida-val-total').value);

            const p = produtos.find(item => item.id == produtoId);
            if (!p) {
                alert("Produto associado não encontrado.");
                return;
            }

            const diferencaQtd = novaQtd - qtdAntiga;
            if (diferencaQtd > 0 && diferencaQtd > p.quantidade) {
                alert(`Estoque insuficiente para esta alteração. Estoque atual: ${p.quantidade}`);
                return;
            }

            try {
                if (diferencaQtd !== 0) {
                    const novoEstoqueProduto = p.quantidade - diferencaQtd;
                    const { error: errProd } = await _supabase.from('produtos').update({ quantidade: novoEstoqueProduto }).eq('id', produtoId);
                    if (errProd) throw errProd;
                }

                const { error: errSaida } = await _supabase.from('saidas').update({
                    tipo: tipo,
                    quantidade: novaQtd,
                    vendedor: vendedor,
                    valor_unitario: valorUnitario,
                    valor_total: valorTotal,
                    data_hora: dataHoraRaw ? new Date(dataHoraRaw).toISOString() : new Date().toISOString()
                }).eq('id', id);

                if (errSaida) throw errSaida;

                fecharModalSaida();
                await carregarDadosSupabase();
                alert('Saída corrigida com sucesso!');
            } catch (err) {
                console.error("Erro ao atualizar saída:", err);
                alert("Erro ao atualizar saída no Supabase: " + err.message);
            }
        }

        async function excluirSaida(id) {
            if (!confirm("Deseja realmente excluir esta venda/transferência? A quantidade será estornada de volta para o estoque.")) return;

            const s = saidas.find(item => item.id == id);
            if (!s) return;

            try {
                if (s.produto_id) {
                    const p = produtos.find(item => item.id == s.produto_id);
                    if (p) {
                        const estoqueEstornado = p.quantidade + s.quantidade;
                        await _supabase.from('produtos').update({ quantidade: estoqueEstornado }).eq('id', s.produto_id);
                    }
                }

                const { error } = await _supabase.from('saidas').delete().eq('id', id);
                if (error) throw error;

                await carregarDadosSupabase();
                alert('Registro excluído e estoque estornado com sucesso!');
            } catch (err) {
                console.error("Erro ao excluir saída:", err);
                alert("Erro ao excluir registro no Supabase: " + err.message);
            }
        }
    </script>
